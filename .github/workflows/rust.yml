name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt install -y qt6-base-dev qt6-declarative-dev qt6-base-private-dev qt6-declarative-private-dev

    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
